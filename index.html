<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>heart</title> 
<style>
/* ============================================================
   CONFIG / VARIABLES
   ============================================================ */
:root{
  --primary-1:#ff004f;
  --primary-2:#ff2d75;
  --primary-3:#ff4da6;
  --secondary-1:#8a2be2;
  --secondary-2:#6c63ff;
  --secondary-3:#00d4ff;
  --accent-1:#ffffff;
  --accent-2:#ffe6f2;
  --glow-1:#ff66cc;
  --glow-2:#ff99ff;
  --glow-3:#66ffff;
  --bg-deep:#04010a;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;height:100%;
  background:var(--bg-deep);
  overflow:hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  cursor:none;
}

#stage{
  position:fixed;
  inset:0;
  perspective:1200px;
  overflow:hidden;
}

/* ------------------------------------------------------------
   BACKGROUND LAYERS
   ------------------------------------------------------------ */
.bg-layer{
  position:absolute;
  inset:-10%;
  width:120%;
  height:120%;
  will-change:transform;
}

#gradientLayer{
  background:
    radial-gradient(ellipse at 20% 20%, rgba(138,43,226,0.35), transparent 55%),
    radial-gradient(ellipse at 80% 30%, rgba(0,212,255,0.25), transparent 55%),
    radial-gradient(ellipse at 50% 80%, rgba(255,0,79,0.3), transparent 60%),
    linear-gradient(160deg, #06010f 0%, #0a0318 35%, #12061f 65%, #04010a 100%);
  animation: gradientShift 22s ease-in-out infinite alternate;
  background-size:200% 200%;
}
@keyframes gradientShift{
  0%{background-position:0% 30%;}
  50%{background-position:70% 60%;}
  100%{background-position:100% 20%;}
}

#auroraLayer{
  mix-blend-mode:screen;
  filter:blur(40px);
  opacity:0.55;
}
#auroraLayer svg{width:100%;height:100%;}

#nebulaCanvas, #starsCanvas, #particleCanvas, #shootingCanvas{
  position:absolute;inset:0;width:100%;height:100%;
}

#fogLayer{
  background:
    radial-gradient(ellipse at 30% 90%, rgba(255,102,204,0.08), transparent 60%),
    radial-gradient(ellipse at 70% 95%, rgba(102,255,255,0.06), transparent 60%);
  mix-blend-mode:screen;
  filter:blur(30px);
  animation: fogDrift 30s ease-in-out infinite alternate;
}
@keyframes fogDrift{
  0%{transform:translate3d(-2%, 0,0) scale(1);}
  100%{transform:translate3d(3%, -2%,0) scale(1.08);}
}

#vignette{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  z-index:40;
}
#grain{
  position:fixed;inset:0;pointer-events:none;
  opacity:0.035;
  z-index:41;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ------------------------------------------------------------
   HEART SCENE
   ------------------------------------------------------------ */
#heartWrap{
  position:absolute;
  left:50%;top:50%;
  width:520px;height:520px;
  margin:-260px 0 0 -260px;
  transform-style:preserve-3d;
  z-index:20;
}
#heartCanvas{
  position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 0 40px rgba(255,45,117,0.55)) drop-shadow(0 0 90px rgba(255,102,204,0.35));
}

/* floating decorative objects layer */
#floatLayer{
  position:absolute;inset:0;width:100%;height:100%;z-index:15;
  pointer-events:none;
}

/* ------------------------------------------------------------
   CURSOR
   ------------------------------------------------------------ */
#cursorGlow{
  position:fixed;
  width:22px;height:22px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,102,204,0.6) 45%, transparent 75%);
  box-shadow:0 0 25px 8px rgba(255,102,204,0.5), 0 0 60px 20px rgba(102,255,255,0.15);
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:100;
  mix-blend-mode:screen;
}
#cursorCanvas{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:99;
  mix-blend-mode:screen;
}

/* ------------------------------------------------------------
   UI TEXT
   ------------------------------------------------------------ */
#title{
  position:fixed;
  bottom:36px;left:0;right:0;
  text-align:center;
  z-index:50;
  pointer-events:none;
  color:var(--accent-2);
  letter-spacing:6px;
  font-size:13px;
  font-weight:300;
  text-transform:uppercase;
  opacity:0.65;
  text-shadow:0 0 20px rgba(255,102,204,0.6);
  animation: titleBreath 4s ease-in-out infinite;
}
@keyframes titleBreath{
  0%,100%{opacity:0.45;}
  50%{opacity:0.85;}
}

#loader{
  position:fixed;inset:0;background:var(--bg-deep);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1.2s ease, visibility 1.2s ease;
}
#loader span{
  color:var(--glow-2);
  letter-spacing:4px;
  font-size:12px;
  opacity:0.7;
  animation:titleBreath 1.4s ease-in-out infinite;
}
.loader-hide{opacity:0;visibility:hidden;}
</style>
</head>
<body>

<div id="loader"><span>ĐANG KHỞI TẠO KHÔNG GIAN...</span></div>

<div id="stage">
  <div class="bg-layer" id="gradientLayer"></div>
  <div class="bg-layer" id="auroraLayer">
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <defs>
        <linearGradient id="auroraGrad1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.5"/>
          <stop offset="50%" stop-color="#8a2be2" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#ff2d75" stop-opacity="0.2"/>
        </linearGradient>
        <linearGradient id="auroraGrad2" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff66cc" stop-opacity="0.4"/>
          <stop offset="60%" stop-color="#6c63ff" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.15"/>
        </linearGradient>
      </defs>
      <path id="auroraPath1" fill="url(#auroraGrad1)" d="M0,300 Q250,100 500,280 T1000,250 V0 H0 Z"/>
      <path id="auroraPath2" fill="url(#auroraGrad2)" d="M0,600 Q300,750 550,600 T1000,650 V1000 H0 Z"/>
    </svg>
  </div>
  <canvas class="bg-layer" id="nebulaCanvas"></canvas>
  <canvas class="bg-layer" id="starsCanvas"></canvas>
  <canvas class="bg-layer" id="shootingCanvas"></canvas>
  <div class="bg-layer" id="fogLayer"></div>

  <div id="floatLayer"></div>

  <div id="heartWrap">
    <canvas id="heartCanvas"></canvas>
  </div>

  <canvas id="particleCanvas"></canvas>
</div>

<div id="vignette"></div>
<div id="grain"></div>
<div id="title">made by tommy</div>

<canvas id="cursorCanvas"></canvas>
<div id="cursorGlow"></div>

<script>
(function(){
"use strict";

/* ============================================================
   UTILS / MATH
   ============================================================ */
const TAU = Math.PI*2;
const rand = (a,b)=> a + Math.random()*(b-a);
const randInt = (a,b)=> Math.floor(rand(a,b+1));
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));
const lerp = (a,b,t)=> a + (b-a)*t;
const easeOutCubic = t=> 1 - Math.pow(1-t,3);
const easeInOutSine = t=> -(Math.cos(Math.PI*t)-1)/2;
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

const PALETTE = {
  primary:['#ff004f','#ff2d75','#ff4da6'],
  secondary:['#8a2be2','#6c63ff','#00d4ff'],
  accent:['#ffffff','#ffe6f2'],
  glow:['#ff66cc','#ff99ff','#66ffff']
};

function hexToRgb(hex){
  const h = hex.replace('#','');
  const v = parseInt(h,16);
  return { r:(v>>16)&255, g:(v>>8)&255, b:v&255 };
}

/* ============================================================
   GLOBAL STATE
   ============================================================ */
const state = {
  w: innerWidth, h: innerHeight, dpr: Math.min(devicePixelRatio||1, 2),
  mouse: { x: innerWidth/2, y: innerHeight/2, nx:0, ny:0, tx:0, ty:0, down:false },
  time: 0, last: performance.now(),
  fps: 60, fpsBuffer: [],
  quality: 1, // auto scales down with low fps
  heartBeatPhase: 0,
  heartScale: 1,
  crystalMode: false,
  crystalTimer: 0,
  cameraShake: 0,
  scrollZoom: 0
};

/* ============================================================
   CANVAS SETUP
   ============================================================ */
function setupCanvas(id){
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  return {c, ctx};
}
const nebula = setupCanvas('nebulaCanvas');
const stars = setupCanvas('starsCanvas');
const shooting = setupCanvas('shootingCanvas');
const particles = setupCanvas('particleCanvas');
const heart = setupCanvas('heartCanvas');
const cursorC = setupCanvas('cursorCanvas');

function resizeAll(){
  state.w = innerWidth; state.h = innerHeight;
  state.dpr = Math.min(devicePixelRatio||1, 2);
  [nebula, stars, shooting, cursorC].forEach(({c,ctx})=>{
    c.width = state.w * state.dpr; c.height = state.h * state.dpr;
    c.style.width = state.w+'px'; c.style.height = state.h+'px';
    ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
  });
  particles.c.width = state.w*state.dpr; particles.c.height = state.h*state.dpr;
  particles.c.style.width='100%'; particles.c.style.height='100%';
  particles.ctx.setTransform(state.dpr,0,0,state.dpr,0,0);

  const hw = document.getElementById('heartWrap');
  const size = Math.min(state.w, state.h) * 0.5;
  hw.style.width = size+'px'; hw.style.height = size+'px';
  hw.style.marginLeft = (-size/2)+'px'; hw.style.marginTop = (-size/2)+'px';
  heart.c.width = size*state.dpr; heart.c.height = size*state.dpr;
  heart.c.style.width='100%'; heart.c.style.height='100%';
  heart.ctx.setTransform(state.dpr,0,0,state.dpr,0,0);

  buildStars();
  buildNebula();
}
window.addEventListener('resize', resizeAll);

/* ============================================================
   STARS
   ============================================================ */
let starField = [];
function buildStars(){
  const count = Math.floor((state.w*state.h)/3800);
  starField = [];
  for(let i=0;i<count;i++){
    starField.push({
      x: rand(0,state.w), y: rand(0,state.h),
      r: rand(0.4,1.8),
      baseA: rand(0.25,1),
      tw: rand(0.5,2.5),
      phase: rand(0,TAU),
      layer: randInt(1,5)
    });
  }
}
function renderStars(dt){
  const {ctx} = stars;
  ctx.clearRect(0,0,state.w,state.h);
  for(const s of starField){
    const par = s.layer*2.2;
    const ox = (state.mouse.nx)*par;
    const oy = (state.mouse.ny)*par;
    const a = s.baseA * (0.6 + 0.4*Math.sin(state.time*s.tw + s.phase));
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.arc(s.x+ox, s.y+oy, s.r, 0, TAU);
    ctx.fill();
    if(s.r>1.3){
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${a*0.15})`;
      ctx.arc(s.x+ox, s.y+oy, s.r*4, 0, TAU);
      ctx.fill();
    }
  }
}

/* ============================================================
   SHOOTING STARS / METEORS
   ============================================================ */
let shootingStars = [];
let shootTimer = 0;
function spawnShootingStar(){
  const fromLeft = Math.random()<0.5;
  const y0 = rand(0, state.h*0.5);
  shootingStars.push({
    x: fromLeft? -50: state.w+50,
    y: y0,
    vx: (fromLeft?1:-1)*rand(9,16),
    vy: rand(3,6),
    len: rand(80,180),
    life: 1,
    width: rand(1.5,2.5)
  });
}
function renderShooting(dt){
  const {ctx} = shooting;
  ctx.clearRect(0,0,state.w,state.h);
  shootTimer -= dt;
  if(shootTimer<=0){
    shootTimer = rand(3.5,8);
    spawnShootingStar();
  }
  shootingStars = shootingStars.filter(m=>{
    m.x += m.vx * dt*60; m.y += m.vy * dt*60;
    m.life -= dt*0.5;
    if(m.life<=0) return false;
    const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx*m.len/10, m.y - m.vy*m.len/10);
    grad.addColorStop(0, `rgba(255,255,255,${m.life})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = m.width;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx*m.len/10, m.y - m.vy*m.len/10);
    ctx.stroke();
    return m.x> -100 && m.x< state.w+100 && m.y< state.h+100;
  });
}

/* ============================================================
   NEBULA (soft blobs, drawn low-res then blurred via filter)
   ============================================================ */
let nebulaBlobs = [];
function buildNebula(){
  nebulaBlobs = [];
  const cols = [PALETTE.secondary[0], PALETTE.secondary[1], PALETTE.primary[0], PALETTE.secondary[2]];
  for(let i=0;i<6;i++){
    nebulaBlobs.push({
      x: rand(0,state.w), y: rand(0,state.h),
      r: rand(state.w*0.15, state.w*0.32),
      color: pick(cols),
      speed: rand(0.02,0.06),
      angle: rand(0,TAU),
      orbit: rand(30,90)
    });
  }
}
function renderNebula(dt){
  const {ctx} = nebula;
  ctx.clearRect(0,0,state.w,state.h);
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(60px)';
  for(const b of nebulaBlobs){
    b.angle += b.speed*dt;
    const x = b.x + Math.cos(b.angle)*b.orbit + state.mouse.nx*10;
    const y = b.y + Math.sin(b.angle)*b.orbit + state.mouse.ny*10;
    const g = ctx.createRadialGradient(x,y,0,x,y,b.r);
    const rgb = hexToRgb(b.color);
    g.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},0.22)`);
    g.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x,y,b.r,0,TAU);
    ctx.fill();
  }
  ctx.filter = 'none';
  ctx.globalCompositeOperation = 'source-over';
}

/* aurora path animation via SVG attribute morph */
let auroraT = 0;
function renderAurora(dt){
  auroraT += dt*0.15;
  const p1 = document.getElementById('auroraPath1');
  const p2 = document.getElementById('auroraPath2');
  const y1 = 250 + Math.sin(auroraT)*60;
  const y2 = 280 + Math.cos(auroraT*1.3)*50;
  p1.setAttribute('d', `M0,${y1+50} Q250,${y1-100} 500,${y1+30} T1000,${y1} V0 H0 Z`);
  const yy1 = 600 + Math.sin(auroraT*1.1)*40;
  const yy2 = 650 + Math.cos(auroraT*0.8)*50;
  p2.setAttribute('d', `M0,${yy1} Q300,${yy1+120} 550,${yy1} T1000,${yy2} V1000 H0 Z`);
}

/* ============================================================
   PARTICLE SYSTEM (pooled)
   ============================================================ */
const POOL_SIZE = 1400;
const pool = [];
for(let i=0;i<POOL_SIZE;i++){
  pool.push({active:false,x:0,y:0,vx:0,vy:0,ax:0,ay:0,life:0,maxLife:1,size:1,color:'#fff',rot:0,vrot:0,type:'spark',shape:0});
}
function getParticle(){
  for(let i=0;i<pool.length;i++){ if(!pool[i].active) return pool[i]; }
  return pool[0]; // recycle oldest if full
}
function spawnBurst(cx, cy, count, opts={}){
  const colors = opts.colors || PALETTE.glow.concat(PALETTE.primary);
  const speedMin = opts.speedMin ?? 1, speedMax = opts.speedMax ?? 7;
  for(let i=0;i<count*state.quality;i++){
    const p = getParticle();
    const a = rand(0,TAU);
    const sp = rand(speedMin, speedMax);
    p.active = true;
    p.x = cx; p.y = cy;
    p.vx = Math.cos(a)*sp; p.vy = Math.sin(a)*sp;
    p.ax = 0; p.ay = opts.gravity ?? 0.02;
    p.life = 0; p.maxLife = rand(opts.lifeMin??0.6, opts.lifeMax??1.6);
    p.size = rand(opts.sizeMin??1, opts.sizeMax??3.2);
    p.color = pick(colors);
    p.rot = rand(0,TAU); p.vrot = rand(-0.1,0.1);
    p.type = opts.type || 'spark';
    p.shape = randInt(0,2);
  }
}
function updateAndRenderParticles(dt){
  const {ctx} = particles;
  ctx.clearRect(0,0,state.w,state.h);
  ctx.globalCompositeOperation = 'lighter';
  for(const p of pool){
    if(!p.active) continue;
    p.life += dt;
    if(p.life>=p.maxLife){ p.active=false; continue; }
    p.vx += p.ax*dt*60*0.016; p.vy += p.ay*dt*60*0.016;
    p.x += p.vx*dt*60; p.y += p.vy*dt*60;
    p.rot += p.vrot*dt*60;
    const t = p.life/p.maxLife;
    const alpha = t<0.15? t/0.15 : (1-((t-0.15)/0.85));
    const sc = p.type==='dust'? 1 : lerp(1,0.3,t);
    const rgb = hexToRgb(p.color);
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = clamp(alpha,0,1);
    if(p.type==='star'){
      drawStarShape(ctx, p.size*3*sc, rgb);
    } else {
      const g = ctx.createRadialGradient(0,0,0,0,0,p.size*sc*3);
      g.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},0.9)`);
      g.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0,0,p.size*sc*3,0,TAU);
      ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${0.8*clamp(alpha,0,1)})`;
      ctx.beginPath();
      ctx.arc(0,0,p.size*sc*0.5,0,TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawStarShape(ctx,size,rgb){
  ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},0.9)`;
  ctx.beginPath();
  for(let i=0;i<4;i++){
    const a = i*Math.PI/2;
    ctx.lineTo(Math.cos(a)*size, Math.sin(a)*size);
    ctx.lineTo(Math.cos(a+Math.PI/4)*size*0.25, Math.sin(a+Math.PI/4)*size*0.25);
  }
  ctx.closePath();
  ctx.fill();
}

/* ambient fireflies / magic dust, continuous low-rate spawn */
let dustTimer=0;
function ambientDust(dt){
  dustTimer -= dt;
  if(dustTimer<=0){
    dustTimer = 0.05;
    const cx = rand(0,state.w), cy = rand(0,state.h);
    spawnBurst(cx,cy,1,{colors:PALETTE.glow, speedMin:0.1, speedMax:0.4, lifeMin:3, lifeMax:6, sizeMin:0.6, sizeMax:1.6, gravity:-0.002, type:'dust'});
  }
}

/* ============================================================
   HEART GEOMETRY (2D parametric heart -> pseudo-3D via layered shading)
   ============================================================ */
function heartPoint(t, scale){
  // classic parametric heart curve
  const x = 16*Math.pow(Math.sin(t),3);
  const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
  return {x: x*scale, y: y*scale};
}
function buildHeartPath(scale){
  const pts=[];
  const steps=140;
  for(let i=0;i<=steps;i++){
    const t = (i/steps)*TAU;
    pts.push(heartPoint(t, scale));
  }
  return pts;
}

function renderHeart(dt){
  const {ctx, c} = heart;
  const size = c.width/state.dpr;
  ctx.clearRect(0,0,size,size);

  const cx = size/2, cy = size/2 + size*0.04;
  const scale = size/38 * state.heartScale;

  // rotation based on mouse
  const rotY = state.mouse.nx * 0.35;
  const rotX = -state.mouse.ny * 0.2;

  ctx.save();
  ctx.translate(cx,cy);

  // pseudo 3D squash based on rotation to fake perspective
  const squashX = 1 - Math.abs(rotY)*0.12;
  ctx.transform(squashX,0, Math.sin(rotY)*0.18, 1+Math.sin(rotX)*0.05, 0,0);

  if(state.crystalMode){
    renderCrystalHeart(ctx, scale);
  } else {
    renderGlassHeart(ctx, scale);
  }

  ctx.restore();
}

function renderGlassHeart(ctx, scale){
  const pts = buildHeartPath(scale);

  // OUTER GLOW (multi-layer bloom)
  for(let i=3;i>=1;i--){
    ctx.save();
    ctx.filter = `blur(${i*14}px)`;
    ctx.globalAlpha = 0.18/i;
    ctx.fillStyle = PALETTE.primary[1];
    tracePath(ctx, pts);
    ctx.fill();
    ctx.restore();
  }

  // MAIN BODY gradient (glass/crystal look)
  const grad = ctx.createLinearGradient(0,-16*scale,0,14*scale);
  grad.addColorStop(0, '#ffdff0');
  grad.addColorStop(0.18, PALETTE.primary[2]);
  grad.addColorStop(0.5, PALETTE.primary[1]);
  grad.addColorStop(0.85, PALETTE.secondary[0]);
  grad.addColorStop(1, PALETTE.secondary[1]);
  ctx.save();
  tracePath(ctx,pts);
  ctx.fillStyle = grad;
  ctx.shadowColor = 'rgba(255,102,204,0.8)';
  ctx.shadowBlur = 35;
  ctx.fill();
  ctx.restore();

  // INNER GLOW pulsing core
  const pulse = 0.55 + 0.45*Math.sin(state.heartBeatPhase);
  ctx.save();
  tracePath(ctx,pts);
  ctx.clip();
  const ig = ctx.createRadialGradient(0,0,0,0,0,20*scale);
  ig.addColorStop(0, `rgba(255,255,255,${0.65*pulse})`);
  ig.addColorStop(0.4, `rgba(255,153,255,${0.35*pulse})`);
  ig.addColorStop(1, 'rgba(255,102,204,0)');
  ctx.fillStyle = ig;
  ctx.fillRect(-25*scale,-25*scale,50*scale,50*scale);
  ctx.restore();

  // SPECULAR HIGHLIGHT
  ctx.save();
  tracePath(ctx,pts);
  ctx.clip();
  ctx.globalAlpha = 0.55;
  const hl = ctx.createRadialGradient(-6*scale,-10*scale,0,-6*scale,-10*scale,10*scale);
  hl.addColorStop(0,'rgba(255,255,255,0.9)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.beginPath();
  ctx.ellipse(-6*scale,-9*scale, 7*scale, 4*scale, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();

  // FACETS (simulated refraction lines)
  ctx.save();
  tracePath(ctx,pts);
  ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  for(let i=0;i<8;i++){
    ctx.beginPath();
    const ang = -0.9 + i*0.28;
    ctx.moveTo(Math.cos(ang)*2, -18*scale);
    ctx.lineTo(Math.cos(ang)*14*scale, 12*scale);
    ctx.stroke();
  }
  ctx.restore();

  // REFLECTION (below heart, faded)
  ctx.save();
  ctx.translate(0, 14*scale);
  ctx.scale(1,-0.4);
  ctx.globalAlpha = 0.18*pulse;
  tracePath(ctx,pts);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // energy rings (ambient, always present faintly)
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.strokeStyle = PALETTE.glow[2];
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0,-2*scale, 19*scale + Math.sin(state.time*1.4)*1.5, 0, TAU);
  ctx.stroke();
  ctx.restore();
}

function renderCrystalHeart(ctx, scale){
  const pts = buildHeartPath(scale);
  ctx.save();
  ctx.filter = 'blur(18px)';
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = PALETTE.secondary[2];
  tracePath(ctx,pts);
  ctx.fill();
  ctx.restore();

  tracePath(ctx,pts);
  ctx.clip();
  ctx.fillStyle = 'rgba(20,10,35,0.35)';
  ctx.fillRect(-25*scale,-25*scale,50*scale,50*scale);

  // faceted crystal shards
  const shardCount = 26;
  for(let i=0;i<shardCount;i++){
    const ang = (i/shardCount)*TAU;
    const r1 = rand(2,8)*scale;
    const r2 = rand(8,18)*scale;
    const x1 = Math.cos(ang)*r1, y1 = Math.sin(ang)*r1 - 2*scale;
    const x2 = Math.cos(ang+0.15)*r2, y2 = Math.sin(ang+0.15)*r2 - 2*scale;
    const x3 = Math.cos(ang-0.15)*r2, y3 = Math.sin(ang-0.15)*r2 - 2*scale;
    const g = ctx.createLinearGradient(x1,y1,x2,y2);
    const c1 = pick(PALETTE.secondary.concat(PALETTE.glow));
    g.addColorStop(0,'rgba(255,255,255,0.5)');
    g.addColorStop(1, c1+'55');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.25)';
    ctx.lineWidth=0.6;
    ctx.stroke();
  }
  ctx.restore();
}

function tracePath(ctx, pts){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
}

/* ============================================================
   HEARTBEAT LOGIC (natural double-thump)
   ============================================================ */
let beatClock = 0;
const beatInterval = 1.15; // seconds between beats
function updateHeartbeat(dt){
  beatClock += dt;
  const t = (beatClock % beatInterval)/beatInterval;
  // double-thump curve using two quick pulses
  let pulse = 0;
  const p1 = clamp(1 - Math.abs(t-0.05)/0.12, 0,1);
  const p2 = clamp(1 - Math.abs(t-0.22)/0.14, 0,1)*0.7;
  pulse = Math.max(p1,p2);
  pulse = easeOutCubic(pulse);
  state.heartScale = 1 + pulse*0.14;
  state.heartBeatPhase = pulse*Math.PI;

  // trigger particle burst at peak of main thump
  if(!state._beatFired && t>0.04 && t<0.07){
    state._beatFired = true;
    const rect = document.getElementById('heartWrap').getBoundingClientRect();
    spawnBurst(rect.left+rect.width/2, rect.top+rect.height/2, 90, {
      colors: PALETTE.glow.concat(PALETTE.primary),
      speedMin:1, speedMax:5, lifeMin:0.5, lifeMax:1.1, sizeMin:1, sizeMax:2.6, gravity:0.015
    });
    spawnShockwave(rect.left+rect.width/2, rect.top+rect.height/2);
  }
  if(t>0.1) state._beatFired = false;
}

/* shockwave rings */
let shockwaves = [];
function spawnShockwave(x,y,opts={}){
  shockwaves.push({x,y, r:0, maxR:opts.maxR||220, life:0, dur:opts.dur||0.7, width:opts.width||3, color:opts.color||PALETTE.glow[0]});
}
function renderShockwaves(dt){
  const {ctx} = particles;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  shockwaves = shockwaves.filter(s=>{
    s.life += dt;
    const t = clamp(s.life/s.dur,0,1);
    if(t>=1) return false;
    const r = easeOutCubic(t)*s.maxR;
    const rgb = hexToRgb(s.color);
    ctx.beginPath();
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${(1-t)*0.6})`;
    ctx.lineWidth = s.width*(1-t*0.5);
    ctx.arc(s.x,s.y,r,0,TAU);
    ctx.stroke();
    return true;
  });
  ctx.restore();
}

/* ============================================================
   FLOATING OBJECTS (DOM-lite via canvas overlay for perf, but using SVG-in-DOM for variety)
   ============================================================ */
const floatLayer = document.getElementById('floatLayer');
const floatObjs = [];
function createFloatObjects(){
  floatLayer.innerHTML='';
  floatObjs.length = 0;
  const kinds = ['heart','star','rose','crystal','orb'];
  const count = 16;
  for(let i=0;i<count;i++){
    const kind = pick(kinds);
    const el = document.createElement('div');
    const size = rand(6,20);
    el.style.position='absolute';
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.left = rand(5,95)+'%';
    el.style.top = rand(5,95)+'%';
    el.style.opacity = rand(0.25,0.75);
    el.style.filter = `drop-shadow(0 0 6px ${pick(PALETTE.glow)})`;
    el.innerHTML = floatSVG(kind);
    floatLayer.appendChild(el);
    floatObjs.push({
      el, baseX: parseFloat(el.style.left), baseY: parseFloat(el.style.top),
      amp: rand(10,30), speed: rand(0.2,0.6), phase: rand(0,TAU),
      rot: rand(0,360), rotSpeed: rand(-15,15), depth: rand(0.5,2)
    });
  }
}
function floatSVG(kind){
  const c = pick(PALETTE.glow.concat(PALETTE.accent));
  switch(kind){
    case 'heart': return `<svg viewBox="0 0 32 29" width="100%" height="100%"><path fill="${c}" d="M23.6 0c-3.4 0-6.3 2-7.6 4.9C14.7 2 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9 12 17 16 20 4-3 16-11 16-20C32 3.8 28.2 0 23.6 0z"/></svg>`;
    case 'star': return `<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="${c}" d="M12 0l3 9h9l-7.5 5.5L19 24l-7-5-7 5 2.5-9.5L0 9h9z"/></svg>`;
    case 'rose': return `<svg viewBox="0 0 24 24" width="100%" height="100%"><circle cx="12" cy="12" r="10" fill="none" stroke="${c}" stroke-width="1.4"/><circle cx="12" cy="12" r="5" fill="${c}" opacity="0.6"/></svg>`;
    case 'crystal': return `<svg viewBox="0 0 24 24" width="100%" height="100%"><polygon fill="${c}" points="12,0 20,8 12,24 4,8"/></svg>`;
    default: return `<svg viewBox="0 0 24 24" width="100%" height="100%"><circle cx="12" cy="12" r="10" fill="${c}" opacity="0.7"/></svg>`;
  }
}
function updateFloatObjects(dt){
  for(const o of floatObjs){
    o.phase += dt*o.speed;
    const px = o.baseX + Math.cos(o.phase)*(o.amp/10) + state.mouse.nx*o.depth*1.2;
    const py = o.baseY + Math.sin(o.phase*1.3)*(o.amp/14) + state.mouse.ny*o.depth*1.2;
    o.rot += o.rotSpeed*dt;
    o.el.style.left = px+'%';
    o.el.style.top = py+'%';
    o.el.style.transform = `translate(-50%,-50%) rotate(${o.rot}deg)`;
  }
}

/* ============================================================
   MOUSE / INTERACTION
   ============================================================ */
window.addEventListener('mousemove', e=>{
  state.mouse.x = e.clientX; state.mouse.y = e.clientY;
  state.mouse.tx = (e.clientX/state.w - 0.5)*2;
  state.mouse.ty = (e.clientY/state.h - 0.5)*2;
  cursorGlow.style.left = e.clientX+'px';
  cursorGlow.style.top = e.clientY+'px';
  pushCursorTrail(e.clientX,e.clientY);
});
window.addEventListener('mousedown', e=>{
  state.mouse.down = true;
  spawnBurst(e.clientX, e.clientY, 300, {colors:PALETTE.glow.concat(PALETTE.primary,PALETTE.accent), speedMin:2, speedMax:10, lifeMin:0.5, lifeMax:1.3, sizeMin:1, sizeMax:3, gravity:0.02});
  spawnShockwave(e.clientX, e.clientY, {maxR:280, width:4});
  state.cameraShake = 8;
});
window.addEventListener('mouseup', ()=> state.mouse.down=false);
document.addEventListener('dblclick', e=>{
  state.crystalMode = true;
  state.crystalTimer = 3.2;
  spawnBurst(e.clientX, e.clientY, 200, {colors:PALETTE.secondary.concat(PALETTE.accent), speedMin:3, speedMax:9, sizeMin:1, sizeMax:2.4});
});
window.addEventListener('wheel', e=>{
  state.scrollZoom = clamp(state.scrollZoom + e.deltaY*0.0004, -0.15, 0.15);
},{passive:true});

const cursorGlow = document.getElementById('cursorGlow');
let cursorTrail = [];
function pushCursorTrail(x,y){
  cursorTrail.push({x,y,life:1});
  if(cursorTrail.length>40) cursorTrail.shift();
}
function renderCursorTrail(){
  const {ctx} = cursorC;
  ctx.clearRect(0,0,state.w,state.h);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<cursorTrail.length;i++){
    const p = cursorTrail[i];
    p.life *= 0.94;
    const t = i/cursorTrail.length;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,153,255,${p.life*0.35*t})`;
    ctx.arc(p.x,p.y, 6*t*p.life+1, 0, TAU);
    ctx.fill();
  }
  cursorTrail = cursorTrail.filter(p=>p.life>0.02);
  ctx.restore();
}

/* ============================================================
   CAMERA / PARALLAX SMOOTHING
   ============================================================ */
function updateCamera(dt){
  state.mouse.nx = lerp(state.mouse.nx, state.mouse.tx, dt*3);
  state.mouse.ny = lerp(state.mouse.ny, state.mouse.ty, dt*3);

  if(state.cameraShake>0){
    state.cameraShake = lerp(state.cameraShake, 0, dt*6);
  }
  const shakeX = (Math.random()-0.5)*state.cameraShake;
  const shakeY = (Math.random()-0.5)*state.cameraShake;

  const stageEl = document.getElementById('stage');
  const zoom = 1 + state.scrollZoom;
  stageEl.style.transform = `scale(${zoom}) translate3d(${shakeX}px, ${shakeY}px, 0)`;

  document.getElementById('gradientLayer').style.transform = `translate3d(${state.mouse.nx*6}px, ${state.mouse.ny*6}px,0)`;
  document.getElementById('auroraLayer').style.transform = `translate3d(${state.mouse.nx*10}px, ${state.mouse.ny*6}px,0)`;
  document.getElementById('fogLayer').style.transform = `translate3d(${state.mouse.nx*4}px, ${state.mouse.ny*4}px,0)`;
}

/* ============================================================
   PERFORMANCE MONITOR
   ============================================================ */
function trackFps(dt){
  const fps = 1/dt;
  state.fpsBuffer.push(fps);
  if(state.fpsBuffer.length>30) state.fpsBuffer.shift();
  const avg = state.fpsBuffer.reduce((a,b)=>a+b,0)/state.fpsBuffer.length;
  state.fps = avg;
  if(avg < 40 && state.quality>0.5){ state.quality = 0.5; }
  else if(avg < 50 && state.quality>0.75){ state.quality = 0.75; }
  else if(avg >= 55){ state.quality = 1; }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function loop(now){
  let dt = (now - state.last)/1000;
  dt = Math.min(dt, 0.05);
  state.last = now;
  state.time += dt;

  trackFps(dt);
  updateCamera(dt);
  updateHeartbeat(dt);

  if(state.crystalMode){
    state.crystalTimer -= dt;
    if(state.crystalTimer<=0) state.crystalMode=false;
  }

  renderNebula(dt);
  renderStars(dt);
  renderShooting(dt);
  renderAurora(dt);
  renderHeart(dt);
  ambientDust(dt);
  updateAndRenderParticles(dt);
  renderShockwaves(dt);
  updateFloatObjects(dt);
  renderCursorTrail();

  requestAnimationFrame(loop);
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  resizeAll();
  createFloatObjects();
  requestAnimationFrame(loop);
  setTimeout(()=>{
    document.getElementById('loader').classList.add('loader-hide');
  }, 500);
}
init();

})();
</script>
